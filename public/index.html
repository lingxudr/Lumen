<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07080B" />
  <meta name="description" content="Platform baca manga, manhwa, dan manhua dengan UI cinematic dan reader nyaman." />
  <meta name="google-site-verification" content="PgpYnUogrn8ysWObJzr9dz3SM0tPUxFA2fvDH0t7je4" />
  <meta property="og:site_name" content="Lumen" />
  <meta property="og:locale" content="id_ID" />
  <meta property="og:title" content="Lumen — Baca Komik Online" />
  <meta property="og:description" content="Baca manga, manhwa, dan manhua terbaru. UI cinematic, reader nyaman, update setiap hari." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.v1lumen.my.id/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Lumen — Baca Komik Online" />
  <meta name="twitter:description" content="Baca manga, manhwa, dan manhua terbaru dengan reader nyaman." />
  <link rel="canonical" href="https://www.v1lumen.my.id/" />
  <title>Lumen — Baca Komik Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/reader-v2.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Lumen" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi">
      <button type="button" class="brand sidebar-brand" onclick="App.go('home')" aria-label="Beranda">
        <span class="brand-mark">L</span>
        <span class="brand-name">Lumen</span>
      </button>
      <nav class="side-nav">
        <button type="button" class="side-link is-active" data-nav="newest" onclick="App.tab('newest')"><span class="side-ico">⌂</span><span>Home</span></button>
        <button type="button" class="side-link" data-nav="browse" onclick="App.tab('browse')"><span class="side-ico">◈</span><span>Discover</span></button>
        <button type="button" class="side-link" data-nav="hot" onclick="App.tab('hot')"><span class="side-ico">▲</span><span>Trending</span></button>
        <button type="button" class="side-link" data-nav="new_series" onclick="App.tab('new_series')"><span class="side-ico">✦</span><span>New</span></button>
        <button type="button" class="side-link" data-nav="completed" onclick="App.tab('completed')"><span class="side-ico">✓</span><span>Completed</span></button>
        <div class="side-sep"></div>
        <button type="button" class="side-link" data-nav="bookmarks" onclick="App.library('bookmarks')"><span class="side-ico">★</span><span>Library</span></button>
        <button type="button" class="side-link" data-nav="history" onclick="App.library('history')"><span class="side-ico">◷</span><span>History</span></button>
      </nav>
      <a class="side-link side-docs" href="/lumenrest/docs">API Docs</a>
    </aside>

    <div class="content-shell">
    <header class="header" id="header">
      <div class="header-inner">
        <button type="button" class="brand header-brand" onclick="App.go('home')" aria-label="Beranda">
          <span class="brand-mark">L</span>
          <span class="brand-name">Lumen</span>
        </button>

        <button type="button" class="search-toggle" id="search-toggle" aria-label="Search" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
          </svg>
        </button>

        <form class="search" id="search-form" onsubmit="return App.search(event)" role="search">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
          </svg>
          <input id="q" type="search" placeholder="Search manga, manhwa, manhua…" autocomplete="off" enterkeyhint="search" />
          <button type="button" class="search-close" id="search-close" aria-label="Close search">✕</button>
        </form>

        <nav class="tabs" aria-label="Navigasi utama">
          <button type="button" class="tab is-active" data-tab="newest" onclick="App.tab('newest')">Terbaru</button>
          <button type="button" class="tab" data-tab="new_series" onclick="App.tab('new_series')">Series Baru</button>
          <button type="button" class="tab" data-tab="completed" onclick="App.tab('completed')">Selesai</button>
          <button type="button" class="tab" data-tab="browse" onclick="App.tab('browse')">Browse</button>
          <button type="button" class="tab" data-tab="hot" onclick="App.tab('hot')">Populer</button>
          <button type="button" class="tab" data-tab="bookmarks" onclick="App.library('bookmarks')">Favorit</button>
          <button type="button" class="tab" data-tab="history" onclick="App.library('history')">Riwayat</button>
        </nav>
      </div>
    </header>

    <main class="main" id="main">
      <!-- HOME -->
      <section id="view-home" class="view">
        <div id="home-hero" class="home-hero is-hidden" aria-live="polite"></div>

        <div id="continue-banner" class="continue-banner is-hidden"></div>

        <div class="home-list-head">
          <div class="home-list-head-text">
            <h1 class="page-title" id="list-title">Terbaru</h1>
            <p class="page-sub" id="list-status">Update komik terbaru setiap hari</p>
            <div id="data-badge" class="data-badge is-hidden" aria-live="polite"></div>
          </div>
          <div class="home-list-actions">
            <button type="button" class="btn btn-filter" id="btn-open-filters" aria-haspopup="dialog">Filter</button>
            <div class="pager pager--compact">
              <button type="button" class="btn btn-icon" id="btn-prev" onclick="App.page(-1)" disabled aria-label="Previous page">←</button>
              <span class="pager-info" id="page-info">1</span>
              <button type="button" class="btn btn-icon" id="btn-next" onclick="App.page(1)" aria-label="Next page">→</button>
              <button type="button" class="btn btn-icon" id="btn-refresh" onclick="App.refresh(true)" title="Refresh" aria-label="Refresh">↻</button>
            </div>
          </div>
        </div>

        <!-- Desktop filters (hidden on small screens via CSS) -->
        <div class="filter-bar filter-bar--desktop" id="filter-bar">
          <div class="filter-group">
            <button type="button" class="chip is-active" data-filter-status="" onclick="App.setFilter('status','')">Semua status</button>
            <button type="button" class="chip" data-filter-status="ongoing" onclick="App.setFilter('status','ongoing')">Ongoing</button>
            <button type="button" class="chip" data-filter-status="completed" onclick="App.setFilter('status','completed')">Completed</button>
          </div>
          <div class="filter-group">
            <button type="button" class="chip is-active" data-filter-format="" onclick="App.setFilter('format','')">Semua tipe</button>
            <button type="button" class="chip" data-filter-format="manga" onclick="App.setFilter('format','manga')">Manga</button>
            <button type="button" class="chip" data-filter-format="manhwa" onclick="App.setFilter('format','manhwa')">Manhwa</button>
            <button type="button" class="chip" data-filter-format="manhua" onclick="App.setFilter('format','manhua')">Manhua</button>
          </div>
          <div class="filter-group filter-group--genres" id="genre-bar" aria-label="Genre"></div>
        </div>

        <div id="series-list" class="grid"></div>
      </section>

      <!-- SERIES -->
      <section id="view-series" class="view is-hidden">
        <div class="series-stage">
          <div id="series-backdrop" class="series-backdrop" aria-hidden="true"></div>
          <button type="button" class="btn btn-ghost back-btn" onclick="App.go('home')">← Back</button>
          <div id="series-detail" class="series-hero"></div>
          <div class="section-label section-label-row" id="chapter-list-label"><span>Daftar Chapter</span></div>
          <div id="chapter-list" class="chapter-list"></div>
        </div>
      </section>

      <!-- LIBRARY -->
      <section id="view-library" class="view is-hidden">
        <div class="toolbar">
          <div>
            <h1 class="page-title" id="library-title">Favorit</h1>
            <p class="page-sub" id="library-status">—</p>
          </div>
          <div class="pager">
            <button type="button" class="btn btn-ghost" data-lib-tab="bookmarks" onclick="App.library('bookmarks')">Favorit</button>
            <button type="button" class="btn btn-ghost" data-lib-tab="history" onclick="App.library('history')">Riwayat</button>
            <button type="button" class="btn btn-ghost" id="btn-clear-history" onclick="App.clearHistory()">Hapus riwayat</button>
          </div>
        </div>
        <div id="library-list" class="grid"></div>
      </section>

      <!-- READER -->
      <section id="view-reader" class="view is-hidden lumen-reader" data-reader-v2="1">
        <!-- Fixed progress (stays when header hides) -->
        <div class="lumen-reader-progress" id="reader-progress" aria-hidden="true">
          <div class="lumen-reader-progress-track">
            <div class="lumen-reader-progress-bar reader-progress-bar" id="reader-progress-bar"></div>
          </div>
          <span class="lumen-reader-progress-pct" id="reader-progress-pct">0%</span>
        </div>

        <!-- Floating glass header -->
        <header class="lumen-reader-header reader-top" id="reader-top">
          <button type="button" class="lumen-reader-icon-btn" onclick="App.backToSeries()" aria-label="Kembali">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <img class="lumen-reader-header-cover" id="reader-cover" alt="" width="36" height="48" />
          <div class="lumen-reader-header-meta">
            <div class="lumen-reader-header-title" id="reader-manga-title">—</div>
            <div class="lumen-reader-header-sub" id="reader-title">Chapter —</div>
          </div>
          <button type="button" class="lumen-reader-icon-btn" id="btn-reader-menu" onclick="App.toggleReaderMenu()" title="Pengaturan" aria-label="Pengaturan">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
          </button>
        </header>

        <!-- Settings sheet / panel -->
        <div class="lumen-reader-settings-backdrop is-hidden" id="reader-settings-backdrop" onclick="App.toggleReaderMenu()"></div>
        <div id="reader-menu" class="lumen-reader-settings reader-menu is-hidden" role="dialog" aria-label="Reader Settings">
          <div class="lumen-reader-settings-handle" aria-hidden="true"></div>
          <div class="lumen-reader-settings-head">
            <h3>Reader Settings</h3>
            <button type="button" class="lumen-reader-icon-btn" onclick="App.toggleReaderMenu()" aria-label="Tutup">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>

          <div class="lumen-reader-settings-body">
            <div class="lumen-reader-setting">
              <span class="lumen-reader-setting-label">Reading Mode</span>
              <div class="lumen-reader-seg seg">
                <button type="button" class="lumen-reader-seg-btn seg-btn is-active" data-mode="webtoon" onclick="App.setReaderMode && App.setReaderMode('webtoon')">Webtoon</button>
                <button type="button" class="lumen-reader-seg-btn seg-btn" data-mode="page" onclick="App.setReaderMode && App.setReaderMode('page')">Page</button>
              </div>
            </div>

            <div class="lumen-reader-setting">
              <span class="lumen-reader-setting-label">Image Width</span>
              <div class="lumen-reader-width-row">
                <span class="lumen-reader-width-ico" aria-hidden="true">▭</span>
                <input type="range" id="reader-width-range" class="lumen-reader-width-range" min="60" max="100" value="100" step="5" oninput="App.setReaderWidth && App.setReaderWidth(this.value)" />
                <span class="lumen-reader-width-ico" aria-hidden="true">▇</span>
              </div>
              <div class="lumen-reader-seg seg" style="margin-top:8px">
                <button type="button" class="lumen-reader-seg-btn seg-btn" data-fit="width" onclick="App.setReaderFit('width')">Full</button>
                <button type="button" class="lumen-reader-seg-btn seg-btn" data-fit="comfortable" onclick="App.setReaderFit('comfortable')">Sedang</button>
                <button type="button" class="lumen-reader-seg-btn seg-btn" data-fit="small" onclick="App.setReaderFit('small')">Kecil</button>
              </div>
            </div>

            <div class="lumen-reader-setting">
              <span class="lumen-reader-setting-label">Theme</span>
              <div class="lumen-reader-seg seg">
                <button type="button" class="lumen-reader-seg-btn seg-btn" data-theme="amoled" onclick="App.setReaderTheme('amoled')">AMOLED</button>
                <button type="button" class="lumen-reader-seg-btn seg-btn is-active" data-theme="dark" onclick="App.setReaderTheme('dark')">Dark</button>
                <button type="button" class="lumen-reader-seg-btn seg-btn" data-theme="sepia" onclick="App.setReaderTheme('sepia')">Sepia</button>
              </div>
            </div>

            <label class="lumen-reader-toggle">
              <span>Auto Next Chapter</span>
              <input type="checkbox" id="pref-auto-next" checked onchange="App.setReaderPref && App.setReaderPref('autoNext', this.checked)" />
              <span class="lumen-reader-switch"></span>
            </label>
            <label class="lumen-reader-toggle">
              <span>Fullscreen</span>
              <input type="checkbox" id="pref-fullscreen" onchange="App.setReaderPref && App.setReaderPref('fullscreen', this.checked)" />
              <span class="lumen-reader-switch"></span>
            </label>
            <label class="lumen-reader-toggle">
              <span>Tap Navigation</span>
              <input type="checkbox" id="pref-tap-nav" checked onchange="App.setReaderPref && App.setReaderPref('tapNav', this.checked)" />
              <span class="lumen-reader-switch"></span>
            </label>
            <label class="lumen-reader-toggle">
              <span>Show Progress Bar</span>
              <input type="checkbox" id="pref-show-progress" checked onchange="App.setReaderPref && App.setReaderPref('showProgress', this.checked)" />
              <span class="lumen-reader-switch"></span>
            </label>
            <label class="lumen-reader-toggle">
              <span>Proxy gambar</span>
              <input type="checkbox" id="use-proxy" checked onchange="App.reloadChapter()" />
              <span class="lumen-reader-switch"></span>
            </label>

            <button type="button" class="lumen-reader-soft-btn" onclick="App.checkHotlink()">Periksa gambar</button>
          </div>
        </div>

        <div id="hotlink-panel" class="probe-panel is-hidden"></div>

        <div class="lumen-reader-content reader-stage" id="reader-stage">
          <button type="button" class="tap-zone tap-zone--prev" id="tap-prev" aria-label="Chapter sebelumnya"></button>
          <button type="button" class="tap-zone tap-zone--next" id="tap-next" aria-label="Chapter berikutnya"></button>
          <div id="reader-pages" class="lumen-reader-pages reader-pages"></div>
        </div>

        <div class="lumen-reader-end reader-end" id="reader-end">
          <div class="lumen-reader-end-art" aria-hidden="true">
            <div class="lumen-reader-chibi lumen-reader-chibi--done">
              <span class="lumen-reader-chibi-face">✓</span>
              <span class="lumen-reader-chibi-spark">✦</span>
            </div>
          </div>
          <p class="lumen-reader-end-title">Chapter Selesai!</p>
          <p class="lumen-reader-end-sub" id="reader-end-chapter-label">Chapter —</p>
          <button type="button" class="lumen-reader-btn-primary" id="btn-next-ch" onclick="App.navChapter(1)">Baca Chapter berikutnya →</button>
          <button type="button" class="lumen-reader-btn-ghost" onclick="App.backToSeries()">← Kembali ke Manga</button>
        </div>

        <!-- Bottom nav -->
        <nav class="lumen-reader-nav" id="reader-bottom-nav" aria-label="Navigasi chapter">
          <button type="button" class="lumen-reader-nav-btn" id="btn-nav-prev" onclick="App.navChapter(-1)">
            <span>←</span><span class="lumen-reader-nav-label">Sebelumnya</span>
          </button>
          <button type="button" class="lumen-reader-nav-center" id="btn-nav-chapter" onclick="App.backToSeries()" title="Daftar chapter">
            <span id="reader-nav-chapter-label">Chapter —</span>
          </button>
          <button type="button" class="lumen-reader-nav-btn" id="btn-nav-next" onclick="App.navChapter(1)">
            <span class="lumen-reader-nav-label">Berikutnya</span><span>→</span>
          </button>
        </nav>
      </section>
    </main>

    </div><!-- content-shell -->

    <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile navigation">
      <button type="button" class="bottom-link is-active" data-nav="newest" onclick="App.tab('newest')"><span>⌂</span><span>Home</span></button>
      <button type="button" class="bottom-link" data-nav="browse" onclick="App.tab('browse')"><span>◈</span><span>Discover</span></button>
      <button type="button" class="bottom-link" data-nav="hot" onclick="App.tab('hot')"><span>▲</span><span>Trending</span></button>
      <button type="button" class="bottom-link" data-nav="bookmarks" onclick="App.library('bookmarks')"><span>★</span><span>Library</span></button>
      <button type="button" class="bottom-link" data-nav="history" onclick="App.library('history')"><span>◷</span><span>History</span></button>
    </nav>

    <!-- Mobile filter sheet -->
    <div class="sheet-backdrop is-hidden" id="filter-backdrop" hidden></div>
    <div class="sheet is-hidden" id="filter-sheet" role="dialog" aria-modal="true" aria-labelledby="filter-sheet-title" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="filter-sheet-title">Filter</h2>
        <button type="button" class="btn btn-icon" id="btn-close-filters" aria-label="Close">✕</button>
      </div>
      <div class="sheet-body">
        <div class="sheet-section">
          <div class="sheet-label">Status</div>
          <div class="filter-group" id="sheet-status">
            <button type="button" class="chip is-active" data-filter-status="" onclick="App.setFilter('status','')">Semua</button>
            <button type="button" class="chip" data-filter-status="ongoing" onclick="App.setFilter('status','ongoing')">Ongoing</button>
            <button type="button" class="chip" data-filter-status="completed" onclick="App.setFilter('status','completed')">Completed</button>
          </div>
        </div>
        <div class="sheet-section">
          <div class="sheet-label">Type</div>
          <div class="filter-group" id="sheet-format">
            <button type="button" class="chip is-active" data-filter-format="" onclick="App.setFilter('format','')">Semua</button>
            <button type="button" class="chip" data-filter-format="manga" onclick="App.setFilter('format','manga')">Manga</button>
            <button type="button" class="chip" data-filter-format="manhwa" onclick="App.setFilter('format','manhwa')">Manhwa</button>
            <button type="button" class="chip" data-filter-format="manhua" onclick="App.setFilter('format','manhua')">Manhua</button>
          </div>
        </div>
        <div class="sheet-section">
          <div class="sheet-label">Genre</div>
          <div class="filter-group filter-group--genres-wrap" id="sheet-genre-bar" aria-label="Genre"></div>
        </div>
      </div>
      <div class="sheet-foot">
        <button type="button" class="btn btn-ghost" id="btn-reset-filters">Reset</button>
        <button type="button" class="btn btn-primary" id="btn-apply-filters">Apply</button>
      </div>
    </div>

    <div id="toast" class="toast is-hidden" role="status"></div>
    <div id="loading" class="overlay is-hidden" aria-hidden="true">
      <div class="spinner"></div>
    </div>
  </div>
  <!-- Set URL Railway di sini setelah deploy proxy -->
  <script>
    // Backend Railway (Voratoon hybrid). Jangan kosongkan di production.
    window.LUMEN_PROXY = window.LUMEN_PROXY || ""; // same-origin /api + /img on Vercel
  </script>
  <script src="/js/app.js" type="module"></script>
</body>
</html>
