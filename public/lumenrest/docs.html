<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lumen REST API — Docs</title>
  <meta name="description" content="Dokumentasi & playground REST API Lumen Reader" />
  <meta name="theme-color" content="#0B1020" />
  <style>
    :root {
      --bg0: #070B18;
      --bg1: #0B1020;
      --bg2: #0F172A;
      --panel: rgba(15, 23, 42, 0.72);
      --panel-solid: #111827;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text: #F8FAFC;
      --text2: #94A3B8;
      --muted: #64748B;
      --primary: #8B5CF6;
      --primary2: #7C3AED;
      --primary3: #A78BFA;
      --ok: #22C55E;
      --err: #EF4444;
      --warn: #F59E0B;
      --get: #38BDF8;
      --radius: 14px;
      --shadow: 0 12px 40px rgba(0,0,0,.35);
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      --header-h: 56px;
      --sidebar-w: 240px;
      --max: 1180px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(124, 58, 237, 0.18), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(56, 189, 248, 0.08), transparent 50%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 40%, var(--bg2));
      line-height: 1.5;
    }
    a { color: var(--primary3); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }

    /* Header */
    .header {
      position: sticky; top: 0; z-index: 50;
      height: var(--header-h);
      display: flex; align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 11, 24, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .header-inner {
      width: 100%;
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .menu-btn, .icon-btn {
      width: 40px; height: 40px; min-width: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      display: grid; place-items: center;
      color: var(--text);
    }
    .menu-btn:hover, .icon-btn:hover { border-color: var(--border-strong); background: rgba(255,255,255,0.06); }
    .brand {
      display: flex; align-items: center; gap: 10px; min-width: 0;
      background: none; border: 0; padding: 0; color: inherit;
    }
    .logo {
      width: 30px; height: 30px; border-radius: 8px;
      background: linear-gradient(135deg, var(--primary2), var(--primary3));
      display: grid; place-items: center; font-weight: 800; font-size: 13px;
      flex: 0 0 auto;
    }
    .brand-text { min-width: 0; }
    .brand-text strong { display: block; font-size: 14px; line-height: 1.15; }
    .brand-text span { display: block; font-size: 11px; color: var(--muted); }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600;
      padding: 4px 9px; border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text2);
      white-space: nowrap;
    }
    .badge .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--ok); box-shadow: 0 0 0 3px rgba(34,197,94,.15);
    }
    .header-spacer { flex: 1; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .btn-link {
      height: 36px; padding: 0 12px; border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text2); font-size: 13px; font-weight: 600;
      display: inline-flex; align-items: center;
    }
    .btn-link:hover { color: var(--text); border-color: var(--border-strong); }
    @media (max-width: 640px) {
      .badge-text { display: none; }
      .btn-link span { display: none; }
    }

    /* Shell */
    .shell {
      max-width: var(--max);
      margin: 0 auto;
      padding: 16px 14px 48px;
      display: grid;
      gap: 16px;
    }
    @media (min-width: 1024px) {
      .shell {
        grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
        gap: 22px;
        padding: 24px 18px 64px;
      }
    }

    /* Sidebar */
    .sidebar {
      display: none;
    }
    @media (min-width: 1024px) {
      .sidebar {
        display: block;
        position: sticky;
        top: calc(var(--header-h) + 16px);
        align-self: start;
        max-height: calc(100dvh - var(--header-h) - 32px);
        overflow: auto;
        padding-right: 4px;
      }
    }
    .nav-group { margin-bottom: 16px; }
    .nav-label {
      font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted);
      margin: 0 8px 8px;
    }
    .nav-item {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--text2);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 13px;
      display: flex; align-items: center; gap: 8px;
      transition: background .15s ease, color .15s ease;
    }
    .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .nav-item.active {
      background: rgba(139, 92, 246, 0.14);
      color: var(--primary3);
    }
    .method-pill {
      font-family: var(--mono);
      font-size: 10px; font-weight: 700;
      color: var(--get);
      min-width: 28px;
    }

    /* Mobile drawer */
    .drawer-backdrop {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(0,0,0,.55);
      opacity: 0; pointer-events: none;
      transition: opacity .2s ease;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 70;
      width: min(86vw, 300px);
      background: #0B1020;
      border-right: 1px solid var(--border);
      transform: translateX(-105%);
      transition: transform .22s ease;
      padding: 16px 12px;
      overflow: auto;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; padding: 0 4px;
    }
    @media (min-width: 1024px) {
      .drawer, .drawer-backdrop { display: none !important; }
    }

    /* Main */
    .main { min-width: 0; }
    .hero {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: calc(var(--radius) + 2px);
      padding: 18px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    @media (min-width: 768px) { .hero { padding: 22px 22px; } }
    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(1.35rem, 4vw, 1.85rem);
      letter-spacing: -0.03em;
    }
    .hero p {
      margin: 0 0 14px;
      color: var(--text2);
      font-size: 14px;
      max-width: 52ch;
    }
    .base-url {
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,.28);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 8px 8px 12px;
      min-width: 0;
    }
    .base-url code {
      flex: 1; min-width: 0;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--primary3);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .copy-btn {
      flex: 0 0 auto;
      height: 34px; padding: 0 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text2);
      font-size: 12px; font-weight: 700;
    }
    .copy-btn:hover { color: var(--text); }
    .copy-btn.ok { color: var(--ok); border-color: rgba(34,197,94,.35); }

    .section-title {
      margin: 8px 0 12px;
      font-size: 13px; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
      color: var(--muted);
    }

    /* Endpoint cards */
    .ep-list { display: grid; gap: 10px; }
    .ep {
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.55);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color .15s ease, background .15s ease;
    }
    .ep:hover { border-color: var(--border-strong); }
    .ep.open {
      border-color: rgba(139, 92, 246, 0.35);
      background: rgba(15, 23, 42, 0.8);
    }
    .ep-head {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      padding: 12px 12px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px 12px;
      align-items: center;
      min-height: 56px;
    }
    @media (min-width: 640px) {
      .ep-head { padding: 14px 16px; grid-template-columns: auto 1fr auto auto; }
    }
    .method {
      font-family: var(--mono);
      font-size: 11px; font-weight: 800;
      color: #0B1020;
      background: var(--get);
      border-radius: 7px;
      padding: 4px 8px;
      letter-spacing: .04em;
    }
    .ep-meta { min-width: 0; }
    .ep-name {
      display: block;
      font-size: 14px; font-weight: 700;
      letter-spacing: -0.01em;
    }
    .ep-desc {
      display: block;
      font-size: 12px; color: var(--text2);
      margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ep-path {
      display: none;
      font-family: var(--mono);
      font-size: 12px; color: var(--muted);
      max-width: 220px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    @media (min-width: 640px) { .ep-path { display: block; } }
    .chev {
      width: 28px; height: 28px;
      display: grid; place-items: center;
      color: var(--muted);
      transition: transform .2s ease;
    }
    .ep.open .chev { transform: rotate(90deg); color: var(--primary3); }

    .ep-body {
      display: none;
      border-top: 1px solid var(--border);
      padding: 14px 12px 16px;
    }
    .ep.open .ep-body { display: block; }
    @media (min-width: 640px) { .ep-body { padding: 16px; } }

    .ep-body .desc {
      margin: 0 0 14px;
      color: var(--text2);
      font-size: 13px;
    }
    .req-line {
      font-family: var(--mono);
      font-size: 12px;
      background: rgba(0,0,0,.28);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
      word-break: break-all;
    }
    .req-line b { color: var(--get); margin-right: 8px; }

    .fields { display: grid; gap: 10px; margin-bottom: 12px; }
    @media (min-width: 560px) { .fields.cols-2 { grid-template-columns: 1fr 1fr; } }
    .field label {
      display: block;
      font-size: 11px; font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .field input {
      width: 100%;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.25);
      padding: 0 12px;
      outline: none;
    }
    .field input:focus {
      border-color: rgba(139, 92, 246, 0.55);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
    }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .btn-primary {
      height: 40px; padding: 0 16px;
      border: 0; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: #fff; font-weight: 700; font-size: 13px;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.25);
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-primary:disabled { opacity: .6; cursor: wait; }
    .btn-ghost {
      height: 40px; padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2); font-weight: 650; font-size: 13px;
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--border-strong); }

    .status-line {
      font-size: 12px; color: var(--muted);
      margin-bottom: 8px;
      display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
    }
    .status-line .code { font-weight: 800; }
    .status-line .code.ok { color: var(--ok); }
    .status-line .code.err { color: var(--err); }
    .tabs {
      display: flex; gap: 4px; flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .tab {
      height: 30px; padding: 0 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted); font-size: 12px; font-weight: 700;
    }
    .tab.active {
      color: var(--text);
      background: rgba(255,255,255,0.05);
      border-color: var(--border);
    }
    .resp {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #070B14;
      overflow: hidden;
    }
    .resp-toolbar {
      display: flex; justify-content: flex-end;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
    }
    .resp pre {
      margin: 0;
      padding: 12px;
      max-height: min(48vh, 420px);
      overflow: auto;
      font-family: var(--mono);
      font-size: 11.5px;
      line-height: 1.45;
      color: #E2E8F0;
      -webkit-overflow-scrolling: touch;
    }
    .empty {
      padding: 18px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .footer {
      max-width: var(--max);
      margin: 0 auto;
      padding: 8px 14px 40px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .footer strong { color: var(--primary3); font-weight: 700; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <button type="button" class="menu-btn" id="btn-menu" aria-label="Buka navigasi">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button type="button" class="brand" onclick="location.href='/lumenrest/docs'">
        <span class="logo">L</span>
        <span class="brand-text">
          <strong>Lumen REST</strong>
          <span>API Docs</span>
        </span>
      </button>
      <span class="badge" title="API operational">
        <span class="dot"></span>
        <span class="badge-text">Operational</span>
      </span>
      <div class="header-spacer"></div>
      <div class="header-actions">
        <a class="btn-link" href="/" aria-label="Kembali ke Lumen">← <span>Back to Lumen</span></a>
      </div>
    </div>
  </header>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-label="Navigasi mobile">
    <div class="drawer-head">
      <strong>Navigasi</strong>
      <button type="button" class="icon-btn" id="btn-close-drawer" aria-label="Tutup">✕</button>
    </div>
    <div id="drawer-nav"></div>
  </aside>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi endpoint"></aside>

    <main class="main">
      <section class="hero">
        <h1>Lumen REST API</h1>
        <p>Powerful API for manga series, chapters, and reader data. Interactive playground — same live endpoints used by Lumen.</p>
        <div class="base-url">
          <code id="base-url"></code>
          <button type="button" class="copy-btn" id="copy-base">Copy</button>
        </div>
      </section>

      <h2 class="section-title">Available Endpoints</h2>
      <div class="ep-list" id="ep-list"></div>
    </main>
  </div>

  <footer class="footer">
    <strong>Lumen Reader</strong> · Watermark on JSON:
    <strong>Powered by Lumen</strong> · lumen.vercel.app
  </footer>

  <script>
    const BASE = location.origin;
    const ENDPOINTS = [
      {
        id: "home",
        group: "Home",
        name: "Home Feed",
        desc: "Homepage newest releases (same data as Lumen Terbaru).",
        path: "/api/series",
        fields: [
          { name: "take", value: "12" },
          { name: "page", value: "1" },
          { name: "mode", value: "newest" },
          { name: "takeChapter", value: "3" },
          { name: "includeMeta", value: "true" },
        ],
      },
      {
        id: "series",
        group: "Series",
        name: "All Series",
        desc: "Browse available manga series (newest / filters).",
        path: "/api/series",
        fields: [
          { name: "take", value: "5" },
          { name: "page", value: "1" },
          { name: "mode", value: "newest" },
          { name: "title", value: "", label: "title (search)" },
          { name: "status", value: "" },
          { name: "format", value: "" },
          { name: "takeChapter", value: "2" },
          { name: "includeMeta", value: "true" },
        ],
      },
      {
        id: "series-detail",
        group: "Series",
        name: "Series Details",
        desc: "Complete metadata for one series by slug.",
        path: "/api/series/{slug}",
        fields: [{ name: "slug", value: "magic-emperor" }],
      },
      {
        id: "search",
        group: "Series",
        name: "Search Series",
        desc: "Search manga by title via title= query.",
        path: "/api/series",
        fields: [
          { name: "title", value: "solo" },
          { name: "take", value: "10" },
        ],
      },
      {
        id: "genres",
        group: "Series",
        name: "Genres",
        desc: "Available genre taxonomy.",
        path: "/api/genres",
        fields: [],
      },
      {
        id: "popular",
        group: "Series",
        name: "Popular",
        desc: "Popular ranking (upstream proxy).",
        path: "/api/popular",
        fields: [
          { name: "take", value: "10" },
          { name: "page", value: "1" },
        ],
      },
      {
        id: "chapters",
        group: "Chapters",
        name: "Chapter List",
        desc: "All chapters for a series.",
        path: "/api/series/{slug}/chapters",
        fields: [{ name: "slug", value: "magic-emperor" }],
      },
      {
        id: "pages",
        group: "Reader",
        name: "Reader Pages",
        desc: "Image URLs for a chapter index.",
        path: "/api/series/{slug}/chapters/{n}",
        fields: [
          { name: "slug", value: "magic-emperor" },
          { name: "n", value: "896", label: "chapter index" },
        ],
      },
    ];

    const listEl = document.getElementById("ep-list");
    const sidebarEl = document.getElementById("sidebar");
    const drawerNav = document.getElementById("drawer-nav");
    const drawer = document.getElementById("drawer");
    const backdrop = document.getElementById("drawer-backdrop");
    const baseUrlEl = document.getElementById("base-url");
    baseUrlEl.textContent = BASE;

    const state = {}; // id -> { open, tab, last }

    function buildUrl(ep, root) {
      let path = ep.path;
      const q = new URLSearchParams();
      for (const f of ep.fields) {
        const input = root.querySelector(`[data-field="${f.name}"]`);
        const v = (input ? input.value : f.value || "").trim();
        if (path.includes("{" + f.name + "}")) {
          path = path.replace("{" + f.name + "}", encodeURIComponent(v || "x"));
        } else if (v !== "") {
          q.set(f.name, v);
        }
      }
      const qs = q.toString();
      return path + (qs ? "?" + qs : "");
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderNav(container) {
      const groups = {};
      ENDPOINTS.forEach((ep) => {
        (groups[ep.group] ||= []).push(ep);
      });
      container.innerHTML = Object.keys(groups).map((g) => {
        const items = groups[g].map((ep) =>
          `<button type="button" class="nav-item" data-goto="${ep.id}">
            <span class="method-pill">GET</span>${esc(ep.name)}
          </button>`
        ).join("");
        return `<div class="nav-group"><div class="nav-label">${esc(g)}</div>${items}</div>`;
      }).join("");
      container.querySelectorAll("[data-goto]").forEach((btn) => {
        btn.addEventListener("click", () => {
          openEndpoint(btn.dataset.goto, true);
          closeDrawer();
        });
      });
    }

    function renderList() {
      listEl.innerHTML = ENDPOINTS.map((ep) => {
        const fields = ep.fields.map((f) => `
          <div class="field">
            <label for="${ep.id}-${f.name}">${esc(f.label || f.name)}</label>
            <input id="${ep.id}-${f.name}" data-field="${f.name}" value="${esc(f.value || "")}" autocomplete="off" />
          </div>`).join("");
        return `
        <article class="ep" id="ep-${ep.id}" data-id="${ep.id}">
          <button type="button" class="ep-head" aria-expanded="false">
            <span class="method">GET</span>
            <span class="ep-meta">
              <span class="ep-name">${esc(ep.name)}</span>
              <span class="ep-desc">${esc(ep.desc)}</span>
            </span>
            <span class="ep-path">${esc(ep.path)}</span>
            <span class="chev" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
            </span>
          </button>
          <div class="ep-body">
            <p class="desc">${esc(ep.desc)}</p>
            <div class="req-line"><b>GET</b><span class="live-path">${esc(ep.path)}</span></div>
            <div class="fields ${ep.fields.length > 1 ? "cols-2" : ""}">${fields || '<div class="empty" style="padding:8px 0">No parameters required</div>'}</div>
            <div class="actions">
              <button type="button" class="btn-primary" data-run>Send Request</button>
              <button type="button" class="btn-ghost" data-copy-url>Copy URL</button>
            </div>
            <div class="status-line" data-status>No response yet — run this endpoint.</div>
            <div class="tabs">
              <button type="button" class="tab active" data-tab="json">JSON</button>
              <button type="button" class="tab" data-tab="raw">Raw</button>
              <button type="button" class="tab" data-tab="headers">Headers</button>
            </div>
            <div class="resp">
              <div class="resp-toolbar">
                <button type="button" class="copy-btn" data-copy-resp>Copy</button>
              </div>
              <pre data-out class="empty-pre">// Response will appear here</pre>
            </div>
          </div>
        </article>`;
      }).join("");

      listEl.querySelectorAll(".ep").forEach((card) => {
        const id = card.dataset.id;
        const ep = ENDPOINTS.find((e) => e.id === id);
        const head = card.querySelector(".ep-head");
        head.addEventListener("click", () => toggleEndpoint(id));

        card.querySelectorAll("input").forEach((inp) => {
          inp.addEventListener("input", () => {
            card.querySelector(".live-path").textContent = buildUrl(ep, card);
          });
        });
        card.querySelector(".live-path").textContent = buildUrl(ep, card);

        card.querySelector("[data-run]").addEventListener("click", () => runEndpoint(id));
        card.querySelector("[data-copy-url]").addEventListener("click", async () => {
          const url = BASE + buildUrl(ep, card);
          await copyText(url, card.querySelector("[data-copy-url]"));
        });
        card.querySelector("[data-copy-resp]").addEventListener("click", async () => {
          const st = state[id];
          const text = st && st.last ? (st.tab === "headers" ? st.last.headersText : st.tab === "raw" ? st.last.raw : st.last.pretty) : "";
          await copyText(text || "", card.querySelector("[data-copy-resp]"));
        });
        card.querySelectorAll("[data-tab]").forEach((tab) => {
          tab.addEventListener("click", () => {
            state[id] = state[id] || {};
            state[id].tab = tab.dataset.tab;
            card.querySelectorAll("[data-tab]").forEach((t) => t.classList.toggle("active", t.dataset.tab === tab.dataset.tab));
            paintResponse(id);
          });
        });
      });
    }

    function toggleEndpoint(id) {
      const card = document.getElementById("ep-" + id);
      const open = !card.classList.contains("open");
      if (open) openEndpoint(id, false);
      else {
        card.classList.remove("open");
        card.querySelector(".ep-head").setAttribute("aria-expanded", "false");
        state[id] = state[id] || {};
        state[id].open = false;
        syncNav();
      }
    }

    function openEndpoint(id, scroll) {
      const card = document.getElementById("ep-" + id);
      if (!card) return;
      // close others for focus (accordion style)
      listEl.querySelectorAll(".ep.open").forEach((c) => {
        if (c.dataset.id !== id) {
          c.classList.remove("open");
          c.querySelector(".ep-head").setAttribute("aria-expanded", "false");
          if (state[c.dataset.id]) state[c.dataset.id].open = false;
        }
      });
      card.classList.add("open");
      card.querySelector(".ep-head").setAttribute("aria-expanded", "true");
      state[id] = state[id] || {};
      state[id].open = true;
      syncNav();
      if (scroll) {
        const top = card.getBoundingClientRect().top + window.scrollY - (parseInt(getComputedStyle(document.documentElement).getPropertyValue("--header-h")) + 12);
        window.scrollTo({ top, behavior: "smooth" });
      }
    }

    function syncNav() {
      const openId = Object.keys(state).find((k) => state[k] && state[k].open);
      document.querySelectorAll(".nav-item").forEach((n) => {
        n.classList.toggle("active", n.dataset.goto === openId);
      });
    }

    async function runEndpoint(id) {
      const ep = ENDPOINTS.find((e) => e.id === id);
      const card = document.getElementById("ep-" + id);
      const path = buildUrl(ep, card);
      card.querySelector(".live-path").textContent = path;
      const statusEl = card.querySelector("[data-status]");
      const out = card.querySelector("[data-out]");
      const btn = card.querySelector("[data-run]");
      btn.disabled = true;
      statusEl.innerHTML = `<span class="code">…</span> Sending request…`;
      out.textContent = "// loading";
      const t0 = performance.now();
      try {
        const res = await fetch(BASE + path, { headers: { Accept: "application/json,*/*" } });
        const ms = Math.round(performance.now() - t0);
        const ct = res.headers.get("content-type") || "";
        const headersText = [...res.headers.entries()].map(([k, v]) => `${k}: ${v}`).join("\n");
        let raw = "";
        let pretty = "";
        let isJson = false;
        if (ct.includes("application/json")) {
          raw = await res.text();
          try {
            pretty = JSON.stringify(JSON.parse(raw), null, 2);
            isJson = true;
          } catch {
            pretty = raw;
          }
        } else {
          const buf = await res.arrayBuffer();
          raw = `Non-JSON response\nstatus: ${res.status}\nbytes: ${buf.byteLength}\ncontent-type: ${ct}`;
          pretty = raw;
        }
        const wm = isJson ? (() => { try { return JSON.parse(raw); } catch { return null; } })() : null;
        const hasWm = !!(wm && (wm.watermark || wm.creator || wm.website));
        statusEl.innerHTML =
          `<span class="code ${res.ok ? "ok" : "err"}">${res.status} ${res.statusText || ""}</span>` +
          `<span>${ms}ms</span>` +
          (hasWm ? `<span style="color:var(--ok)">watermark ✓</span>` : isJson ? `<span style="color:var(--warn)">watermark —</span>` : "");
        state[id] = state[id] || {};
        state[id].tab = state[id].tab || "json";
        state[id].last = { pretty, raw, headersText, ok: res.ok, status: res.status, ms };
        paintResponse(id);
      } catch (e) {
        statusEl.innerHTML = `<span class="code err">Request failed</span><span>${esc(e.message || e)}</span>`;
        state[id] = state[id] || {};
        state[id].last = { pretty: String(e), raw: String(e), headersText: "", ok: false };
        paintResponse(id);
      } finally {
        btn.disabled = false;
      }
    }

    function paintResponse(id) {
      const card = document.getElementById("ep-" + id);
      const st = state[id] || {};
      const out = card.querySelector("[data-out]");
      if (!st.last) {
        out.textContent = "// Response will appear here";
        return;
      }
      const tab = st.tab || "json";
      out.textContent = tab === "headers" ? (st.last.headersText || "(no headers)") : tab === "raw" ? st.last.raw : st.last.pretty;
    }

    async function copyText(text, btn) {
      try {
        await navigator.clipboard.writeText(text);
        if (btn) {
          const prev = btn.textContent;
          btn.textContent = "Copied";
          btn.classList.add("ok");
          setTimeout(() => { btn.textContent = prev; btn.classList.remove("ok"); }, 1200);
        }
      } catch {
        if (btn) btn.textContent = "Failed";
      }
    }

    function openDrawer() {
      drawer.classList.add("open");
      backdrop.classList.add("open");
      document.getElementById("btn-menu").setAttribute("aria-expanded", "true");
    }
    function closeDrawer() {
      drawer.classList.remove("open");
      backdrop.classList.remove("open");
      document.getElementById("btn-menu").setAttribute("aria-expanded", "false");
    }

    document.getElementById("btn-menu").addEventListener("click", openDrawer);
    document.getElementById("btn-close-drawer").addEventListener("click", closeDrawer);
    backdrop.addEventListener("click", closeDrawer);
    document.getElementById("copy-base").addEventListener("click", () => copyText(BASE, document.getElementById("copy-base")));

    renderNav(sidebarEl);
    renderNav(drawerNav);
    renderList();
  </script>
</body>
</html>
